<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kontakt - Finn Holle</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-gray-100 text-gray-800 font-sans">
    <!-- Navigation -->
    <nav class="fixed w-full bg-white shadow-md z-50">
        <div class="container mx-auto px-6 py-4">
            <div class="flex justify-between items-center">
                <a href="index.html" class="text-2xl font-bold text-gray-900">Finn Holle</a>
                <div class="hidden md:flex space-x-8">
                    <a href="index.html" class="text-gray-600 hover:text-blue-600 transition duration-300">Home</a>
                    <a href="about.html" class="text-gray-600 hover:text-blue-600 transition duration-300">Über mich</a>
                    <a href="projects.html" class="text-gray-600 hover:text-blue-600 transition duration-300">Projekte</a>
                    <a href="contact.html" class="text-blue-600 font-semibold">Kontakt</a>
                </div>
                <button class="md:hidden text-gray-600 hover:text-blue-600 focus:outline-none" id="mobile-menu-button">
                    <i data-feather="menu" class="w-6 h-6"></i>
                </button>
            </div>
        </div>
    </nav>

    <!-- Contact Section -->
    <section class="pt-24 pb-20">
        <div class="container mx-auto px-6">
            <h1 class="text-4xl md:text-5xl font-bold text-center text-gray-900 mb-12">Kontakt</h1>
            <div class="max-w-2xl mx-auto">
                <div class="bg-white rounded-lg shadow-md p-8">
                    <div class="space-y-6">
                        <div class="flex items-center">
                            <i data-feather="mail" class="w-6 h-6 text-blue-600 mr-4"></i>
                            <a href="mailto:finn.holle@hotmail.com" class="text-gray-600 hover:text-blue-600 transition duration-300">
                                finn.holle@hotmail.com
                            </a>
                        </div>
                        <div class="flex items-center">
                            <i data-feather="phone" class="w-6 h-6 text-blue-600 mr-4"></i>
                            <a href="tel:+41793479995" class="text-gray-600 hover:text-blue-600 transition duration-300">
                                +41 79 347 99 95
                            </a>
                        </div>
                        <div class="flex items-center">
                            <i data-feather="linkedin" class="w-6 h-6 text-blue-600 mr-4"></i>
                            <a href="https://www.linkedin.com/in/finn-holle-6392b328b/" target="_blank" class="text-gray-600 hover:text-blue-600 transition duration-300">
                                LinkedIn Profil
                            </a>
                        </div>
                        <div class="flex items-center">
                            <i data-feather="github" class="w-6 h-6 text-blue-600 mr-4"></i>
                            <a href="https://github.com/FiddenFast" target="_blank" class="text-gray-600 hover:text-blue-600 transition duration-300">
                                GitHub Profil
                            </a>
                        </div>
                        <div class="flex items-start">
                            <i data-feather="map-pin" class="w-6 h-6 text-blue-600 mr-4 mt-1"></i>
                            <div class="text-gray-600 leading-relaxed">
                                Panoramaweg 6<br>
                                8916 Jonen<br>
                                Schweiz
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Kontaktformular -->
                <div class="bg-white rounded-lg shadow-md p-8 mt-8">
                    <h2 class="text-2xl font-bold text-gray-900 mb-6">Kontaktformular</h2>
                    <form id="contactForm" class="space-y-6" novalidate>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                            <div>
                                <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Name *</label>
                                <input type="text" id="name" name="name" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
                                    placeholder="Ihr vollständiger Name">
                                <div class="text-red-500 text-sm mt-1 hidden" id="name-error"></div>
                            </div>
                            <div>
                                <label for="email" class="block text-sm font-medium text-gray-700 mb-2">E-Mail *</label>
                                <input type="email" id="email" name="email" required
                                    class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
                                    placeholder="ihre.email@beispiel.com">
                                <div class="text-red-500 text-sm mt-1 hidden" id="email-error"></div>
                            </div>
                        </div>
                        <div>
                            <label for="subject" class="block text-sm font-medium text-gray-700 mb-2">Betreff *</label>
                            <input type="text" id="subject" name="subject" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200"
                                placeholder="Worum geht es?">
                            <div class="text-red-500 text-sm mt-1 hidden" id="subject-error"></div>
                        </div>
                        <div>
                            <label for="message" class="block text-sm font-medium text-gray-700 mb-2">Nachricht *</label>
                            <textarea id="message" name="message" rows="4" required
                                class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-colors duration-200 resize-none"
                                placeholder="Ihre Nachricht an mich..."></textarea>
                            <div class="text-red-500 text-sm mt-1 hidden" id="message-error"></div>
                        </div>
                        <div class="flex items-center justify-between">
                            <p class="text-sm text-gray-500">* Pflichtfelder</p>
                            <button type="submit" id="submitButton"
                                class="bg-blue-600 text-white py-3 px-8 rounded-md hover:bg-blue-700 transition duration-300 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 disabled:opacity-50 disabled:cursor-not-allowed">
                                <span class="flex items-center justify-center">
                                    <svg class="w-5 h-5 mr-2 hidden" id="loadingIcon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                    </svg>
                                    <span id="buttonText">Nachricht senden</span>
                                </span>
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </section>

    <script src="script.js?v=3"></script>
    <script src="emailjs-config.js?v=2"></script>
</body>
</html>
